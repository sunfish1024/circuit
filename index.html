<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>電子回路学習ゲーム</title>

  <meta
    name="description"
    content="NANDgame風の操作で電子回路を学ぶ、静的Web学習ゲームです。"
  />

  <meta name="color-scheme" content="dark light" />

  <!--
    GitHub Pages / 静的ホスティングでは、
    相対パス ./ を基準にしておくのが安全です。
  -->
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./styles/main.css" />

  <!--
    main.css や src/main.js がまだ揃っていない段階でも、
    最低限「起動中 / エラー」が表示されるための最小インラインスタイルです。
    本格的な見た目は styles/main.css に委譲します。
  -->
  <style>
    :root {
      color-scheme: dark light;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #111827;
      color: #e5e7eb;
      font-family:
        "Segoe UI",
        "Hiragino Sans",
        "Noto Sans JP",
        "Yu Gothic UI",
        sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    .boot-message {
      max-width: 560px;
      padding: 16px 20px;
      border: 1px solid #374151;
      border-radius: 12px;
      background: #1f2937;
      font-size: 14px;
      line-height: 1.7;
    }

    noscript {
      display: block;
      padding: 24px;
      font-size: 16px;
    }
  </style>

  <!--
    起動失敗をユーザーに知らせるための最小ガードです。
    実際のアプリ起動が完了したら、
    今後の src/main.js 側で window.__APP_BOOTED__ = true を設定します。
  -->
  <script>
    window.__APP_BOOTED__ = false;

    window.addEventListener(
      "error",
      () => {
        if (window.__APP_BOOTED__) return;

        const message = document.getElementById("boot-message");

        if (message) {
          message.textContent =
            "起動中にエラーが発生しました。ブラウザのコンソールを確認してください。";
        }
      },
      true
    );

    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        if (window.__APP_BOOTED__) return;

        const message = document.getElementById("boot-message");

        if (message) {
          message.textContent =
            "起動に時間がかかっています。" +
            "src/main.js と styles/main.css が存在するか確認してください。";
        }
      }, 3000);
    });
  </script>
</head>

<body>
  <noscript>
    この電子回路学習ゲームを使うには、JavaScript を有効にしてください。
  </noscript>

  <!--
    ここがアプリ全体のマウント先です。
    今後の src/main.js が、この #app の中にヘッダー、パレット、
    ボード、インスペクタなどを描画します。
  -->
  <div id="app" aria-live="polite">
    <div class="boot-message" id="boot-message">
      電子回路学習ゲームを読み込み中...
    </div>
  </div>

  <!--
    ES Modules で読み込みます。
    GitHub Pages で動かすため、ビルド不要の構成を維持します。
  -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
